<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kingfisher Update</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self';"
    />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #252528;
        --fg: #f5f5f7;
        --dim: #b6b6bd;
        --line: #54545a;
        --button: #414146;
        --accent: #82b8ff;
        --primary-text: #10243e;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f5f5f7;
          --fg: #202024;
          --dim: #606067;
          --line: #cccbd0;
          --button: #fff;
          --accent: #0067d9;
          --primary-text: #fff;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font:
          13px/1.4 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }
      .window:focus {
        outline: none;
      }
      .window {
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 16px 20px 18px;
        gap: 12px;
      }
      main {
        display: grid;
        grid-template-columns: 56px minmax(0, 1fr);
        gap: 16px;
        flex: 1;
        min-height: 0;
      }
      .icon {
        width: 56px;
        height: 56px;
        border-radius: 12px;
      }
      .copy {
        min-width: 0;
        overflow-y: auto;
      }
      p,
      h1 {
        margin: 0;
      }
      .version-line {
        color: var(--dim);
        font-size: 11px;
        margin-bottom: 5px;
      }
      .headline {
        font-size: 15px;
        font-weight: 600;
        line-height: 1.3;
        margin-bottom: 7px;
      }
      .detail {
        color: var(--dim);
        font-size: 12px;
        overflow-wrap: anywhere;
      }
      .footnote {
        color: var(--dim);
        font-size: 11px;
        margin-top: 8px;
      }
      .footnote:empty {
        display: none;
      }
      .progress {
        height: 5px;
        background: var(--line);
        border-radius: 3px;
        overflow: hidden;
        margin-top: 12px;
      }
      .progress.hidden {
        display: none;
      }
      .progress > div {
        height: 100%;
        background: var(--accent);
        width: 0;
      }
      .progress.indeterminate > div {
        width: 30%;
        animation: progress 1.4s ease-in-out infinite;
      }
      @keyframes progress {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(400%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .progress.indeterminate > div {
          animation: none;
          width: 100%;
          opacity: 0.6;
        }
      }
      footer {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      button {
        font: inherit;
        font-size: 12px;
        color: var(--fg);
        background: var(--button);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 5px 12px;
        min-width: 68px;
      }
      button.primary {
        background: var(--accent);
        color: var(--primary-text);
        border-color: transparent;
        font-weight: 500;
      }
      button:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3.5px color-mix(in srgb, var(--accent) 45%, transparent);
      }
      button:disabled {
        opacity: 0.5;
      }
      button:not(:disabled):active {
        filter: brightness(0.9);
      }
    </style>
  </head>
  <body>
    <div
      class="window"
      role="dialog"
      aria-labelledby="headline"
      aria-describedby="detail"
      tabindex="-1"
    >
      <main>
        <img class="icon" src="kingfisher.png" alt="" width="56" height="56" />
        <div class="copy">
          <p class="version-line" id="version-line">Kingfisher</p>
          <div role="status" aria-live="polite" aria-atomic="true">
            <h1 class="headline" id="headline">Software Update</h1>
            <p class="detail" id="detail">Loading update status…</p>
          </div>
          <div
            class="progress hidden"
            id="progress"
            role="progressbar"
            aria-label="Update progress"
            aria-valuemin="0"
            aria-valuemax="100"
          >
            <div id="progress-fill"></div>
          </div>
          <p class="footnote" id="footnote"></p>
        </div>
      </main>
      <footer>
        <button type="button" id="secondary" hidden></button>
        <button type="button" id="primary" class="primary" disabled>Check for Updates</button>
      </footer>
    </div>
    <script src="update.js"></script>
  </body>
</html>
