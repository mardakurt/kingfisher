# How Kingfisher becomes an application.
#
# Three things in here are load-bearing and easy to get wrong silently:
#
#   `extraResources` reproduces, under `Resources/kingfisher/`, the directory
#   layout the companion expects — it resolves its own root as two levels above
#   `companion/src/`, and reads `scripts/engine-catalogue.mjs` and
#   `public/engine/` relative to it. `desktop/src/paths.mjs` is the other half
#   of this arrangement and the two have to agree.
#
#   Nothing that is spawned or opened may live inside the asar archive. The
#   companion is a process, the web bundle is a server, and both are unpacked.
#
#   `hardenedRuntime` with the entitlements beside it is what lets a notarised
#   build run a downloaded engine at all. Without `allow-jit` the renderer's
#   own WebAssembly engine will not start either.
#
# The `extraResources` block below was dropped in a Phase 35 rewrite of this
# file and nobody launched the result: every packaged build from that commit
# to Phase 45 started, logged "This build is incomplete", showed an error box
# and exited before a window — which the Phase 45 harness reported as a
# Playwright `firstWindow` timeout. `desktop/src/builder-config.test.mjs` now
# pins every entry, and `desktop:smoke --packaged` is the launch nobody ran.

appId: app.kingfisher.chess
productName: Kingfisher
copyright: Copyright © 2026 Kingfisher.

directories:
  output: dist
  # Build resources live in `desktop/build`. Anything dropped here is
  # automatically picked up by electron-builder without explicit paths.
  buildResources: build

# The shell itself, and nothing else. The application it serves and the
# companion it runs are resources, below — they are spawned, so they cannot
# live inside the archive.
files:
  - src/**/*
  - package.json
  - '!**/*.test.mjs'
  - '!web/**/*'
  - '!**/*.map'
  - '!**/*.tsbuildinfo'
  - '!**/.DS_Store'

asar: true

# Missing runtime resources fail packaging before signing (afterPack), and
# the signed, notarised application is launched — bridge, web server,
# companion, engine catalogue, update feed — before any archive is made
# (afterSign). A build that cannot start does not become a DMG.
afterPack: scripts/verify-package.mjs
afterSign: scripts/verify-package-boot.mjs

extraMetadata:
  main: src/main.mjs

extraResources:
  - from: web
    to: kingfisher/web
    # `**/*` alone misses two things that are the whole bundle: a directory
    # whose name begins with a dot, and `node_modules`, which the packager
    # filters everywhere else on purpose. Both are named, because a build that
    # silently ships `server.js` with nothing to serve looks like a build that
    # worked until the window fails to open.
    filter:
      - '**/*'
      - '.next/**/*'
      - '!**/.DS_Store'
  # `node_modules` is filtered out of every copy the packager makes, which is
  # right everywhere except here: Next's standalone output *is* a server plus
  # the modules it reached, and without them `server.js` starts and serves
  # nothing. Naming it as its own source is what gets it past that rule.
  - from: web/node_modules
    to: kingfisher/web/node_modules
  - from: ../companion/src
    to: kingfisher/companion/src
    filter:
      - '**/*'
      - '!**/*.test.mjs'
      - '!__fixtures__/**'
  - from: ../scripts/engine-catalogue.mjs
    to: kingfisher/scripts/engine-catalogue.mjs
  - from: ../scripts/engine-digests.json
    to: kingfisher/scripts/engine-digests.json
  # The sanitised pair, not `../public/engine` — see `build-desktop-web.mjs`.
  # The checkout's own records name absolute paths on the build machine, and
  # this copy does not pass through the standalone bundle, so it was still
  # shipping them after the served copy had been cleaned.
  - from: resources/engine
    to: kingfisher/public/engine
    filter:
      - '*.json'
  # The Syzygy probe helper, where the companion already looks for it: it
  # resolves `engines/tablebase/` relative to its own root, which in a bundle
  # is `Resources/kingfisher`. Empty when this machine has no C compiler, and
  # then the application uses the remote tablebase and says so. The filter
  # names the one file rather than `**/*`, because a Finder duplicate
  # (`kingfisher-tbprobe 3`) shipped inside the public 1.0.0 bundle.
  - from: resources/tablebase
    to: kingfisher/engines/tablebase
    filter:
      - 'kingfisher-tbprobe'

# The Electron build target. Pinned so that a build is a property of the
# commit and not of whatever `desktop/node_modules` happens to hold.
electronVersion: 44.2.0

mac:
  # Apple Silicon only. There is no x64 build, no universal build, and the
  # updater never offers one. The list is deliberately `arm64` alone, so a
  # wrong-architecture download is impossible from this configuration.
  target:
    - target: dmg
      arch: arm64
    # The auto-update ZIP is the *install payload* the updater downloads. The
    # DMG is what first-time users open; the ZIP is what an installed
    # application replaces itself with. Both come from the same signed .app in
    # the same electron-builder run.
    - target: zip
      arch: arm64
  category: public.app-category.games
  hardenedRuntime: true
  gatekeeperAssess: false
  darkModeSupport: true
  extendInfo:
    NSHumanReadableCopyright: 'Copyright © 2026 Kingfisher.'
    LSApplicationCategoryType: public.app-category.games
    # Electron 44 itself requires macOS 11 (Big Sur) or newer; this is the
    # floor the bundle declares so Finder refuses to launch on anything older
    # instead of crashing. `docs/release/install-macos.md` states the same
    # number and `docs-check` compares the two.
    LSMinimumSystemVersion: '11.0'
    NSHighResolutionCapable: true
    # Kingfisher reaches Lichess and the engine projects' release pages over
    # HTTPS, and a local companion over plain HTTP on loopback. The exception
    # is scoped to loopback so that "the app may use HTTP" never means the
    # network.
    NSAppTransportSecurity:
      NSAllowsLocalNetworking: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # electron-builder notarises the signed .app through @electron/notarize when
  # APPLE_API_KEY, APPLE_API_KEY_ID and APPLE_API_ISSUER are set (a dev build
  # without them is signed and not notarised, with a warning). That happens in
  # the directory step, so the boot gate runs against the stapled app and the
  # DMG and ZIP are archived from it. The DMG gets its own ticket afterwards:
  # `npm run release:mac:notarize`. `build.mjs` refuses a preview or stable
  # build without the credentials.
  notarize: true
  artifactName: '${productName}-${version}-${arch}.${ext}'

# Double-clicking a PGN opens it in Kingfisher. `desktop/src/files.mjs` is
# what actually decides whether a given file is one Kingfisher will open; this
# is only the declaration that lets the Finder offer it. It was lost in the
# same Phase 35 rewrite as `extraResources` and shipped absent in every build
# since — `Open With → Kingfisher` on a .pgn did not exist.
fileAssociations:
  - ext: pgn
    name: PGN game
    description: Portable Game Notation chess games
    role: Viewer
    rank: Alternate
    mimeType: application/vnd.chess-pgn

# Phase 35: a polished DMG. Every field here has a reason.
# `dmg:` is a top-level property in electron-builder 26+, not a
# nested `mac:` sub-key. The custom background (1x and 2x) was
# generated by `scripts/build-dmg-background.py` from the project
# icon and committed alongside the build resources so the toolchain
# is reproducible without re-running the generator.
dmg:
  # The disk image is signed with the same Developer ID as the application, so
  # that Gatekeeper's assessment of the image itself (`spctl --type open`) has
  # a signature to evaluate; a notarised but unsigned DMG is rejected with "no
  # usable signature". `release:mac:notarize` then staples the image's ticket.
  sign: true
  background: build/dmg/background.png
  # The volume icon. By default electron-builder uses the app icon;
  # we point at the same .icns explicitly so the volume gets the
  # full multires asset Finder prefers for sidebar surfaces, not the
  # 1024x1024 PNG the build also has.
  icon: build/dmg/icon.icns
  # Icon size in points. 96 is comfortable on a Retina display
  # without crowding the labels. 80 (the default) is too tight
  # when the labels below are not abbreviated.
  iconSize: 96
  iconTextSize: 13
  # The volume name. `Kingfisher` alone is the cleanest option and matches the
  # design the background is built around; `desktop/scripts/verify-dmg.mjs`
  # asserts it.
  title: '${productName}'
  # The contents. x and y are *centres* at 1x, symmetric about the
  # 720-wide background's middle; `build-dmg-background.py`'s
  # ICON_CENTRES are the same two points and the arrow is drawn
  # between them. The background image is 720x460, and Finder sizes
  # the window to it.
  contents:
    - x: 210
      y: 230
      type: file
      name: Kingfisher.app
    - x: 510
      y: 230
      type: link
      # Symlink to the system Applications folder. Finder
      # presents it as the same icon a user would see in their
      # dock or sidebar, not as a link badge.
      path: /Applications
      name: Applications
  window:
    x: 100
    y: 120
    width: 720
    height: 460
  format: UDZO
  filesystem: HFS+

# Phase 36: when present, electron-builder reads these standard
# variables and signs + notarizes the produced artifacts. They are
# intentionally not committed; the release process documents where
# they come from (owner machine or a `release` GitHub environment).
#
#   CSC_LINK                 path or base64 of the .p12 containing
#                            the Developer ID Application
#                            certificate + private key.  Generated
#                            once from a Keychain export and
#                            imported back into the build
#                            keychain by electron-builder.
#   CSC_KEY_PASSWORD         password for that .p12.
#   CSC_IDENTITY_AUTO_DISCOVERY=false
#                            keeps electron-builder from
#                            accidentally falling back to an
#                            unrelated "Apple Development"
#                            identity when CSC_LINK is absent.
#   APPLE_API_KEY            path to the App Store Connect API
#                            key (.p8) for notarization.
#   APPLE_API_KEY_ID         key id from App Store Connect.
#   APPLE_API_ISSUER         issuer id of the App Store Connect
#                            team.  Together with the previous
#                            two this authenticates the
#                            submission without an iCloud
#                            password.
#
# When CSC_LINK is absent electron-builder signs with whatever identity the
# keychain offers — on the maintainer's machine today that is `Apple
# Development`, which lets the build run locally and nowhere else. The
# `release:preflight:mac` gate refuses to run a *trusted* release build
# without a `Developer ID Application` certificate present.
#
# The stable feed. Declaring it is what makes electron-builder write
# `app-update.yml` into the bundle and `latest-mac.yml` beside the ZIP —
# with `publish: null` neither existed, and a packaged build's *Check for
# Updates…* had no feed to ask. `desktop/scripts/build.mjs` always passes
# `--publish never`, so nothing is uploaded at build time; the release
# process uploads with `gh release upload` after verification. Prereleases
# (the macOS preview channel) are invisible to this feed:
# `allowPrerelease` is false in `kingfisher-updater.mjs`.
publish:
  provider: github
  owner: mardakurt
  repo: kingfisher
  releaseType: release
