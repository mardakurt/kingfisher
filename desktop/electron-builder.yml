appId: app.kingfisher.chess
productName: Kingfisher

directories:
  output: dist
  # Build resources live in `desktop/build`. Anything dropped here is
  # automatically picked up by electron-builder without explicit paths,
  # which keeps the `mac:` block below readable.
  buildResources: build

files:
  # Bundle the macOS shell, the desktop web server, and the
  # companion — the three processes the application needs. The
  # .gitignore keeps build artifacts out of source control.
  - src/**/*
  - web/**/*
  - package.json
  - '!**/*.map'
  - '!**/*.tsbuildinfo'
  - '!**/.DS_Store'

asar: true

extraMetadata:
  main: src/main.mjs

# The Electron build target. The previous one was the 1.0.0 line; the
# current 1.1.0 line ships a slightly newer Electron that picks up
# macOS 14 accessibility and window-restore fixes that the dialog
# relies on.
electronVersion: 44.2.0

mac:
  # Apple Silicon first. x64 is unverified; the updater never offers
  # it because there is no build of Kingfisher 1.1.0 for that arch.
  # The list is deliberately `arm64` only, not `["arm64", "x64"]`,
  # so a wrong-architecture download is impossible from this script.
  target:
    - target: dmg
      arch: arm64
    # Phase 36: the auto-update ZIP is the *install payload* the
    # updater downloads. The DMG is still what first-time users
    # open; this ZIP is what existing users replace themselves
    # with. They are produced from the same signed .app by the
    # same electron-builder run, so the same Developer ID
    # identity flows through both paths.
    - target: zip
      arch: arm64
  category: public.app-category.games
  hardenedRuntime: true
  gatekeeperAssess: false
  darkModeSupport: true
  extendInfo:
    NSHumanReadableCopyright: 'Copyright © 2026 Kingfisher.'
    LSApplicationCategoryType: public.app-category.games
    LSMinimumSystemVersion: '11.0'
    NSHighResolutionCapable: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  artifactName: '${productName}-${version}-${arch}.${ext}'

# Phase 35: a polished DMG. Every field here has a reason.
# `dmg:` is a top-level property in electron-builder 26+, not a
# nested `mac:` sub-key. The custom background (1x and 2x) was
# generated by `scripts/build-dmg-background.py` from the project
# icon and committed alongside the build resources so the toolchain
# is reproducible without re-running the generator.
dmg:
  background: build/dmg/background.png
  # The volume icon. By default electron-builder uses the app icon;
  # we point at the same .icns explicitly so the volume gets the
  # full multires asset Finder prefers for sidebar surfaces, not the
  # 1024x1024 PNG the build also has.
  icon: build/dmg/icon.icns
  # Icon size in points. 96 is comfortable on a Retina display
  # without crowding the labels. 80 (the default) is too tight
  # when the labels below are not abbreviated.
  iconSize: 96
  iconTextSize: 13
  # The volume name. `Kingfisher` alone is the cleanest option
  # and matches the design the background is built around. The
  # `${version}` macro would produce "Kingfisher 1.1.0" which
  # is also fine but a half-step away from the brand voice.
  title: '${productName}'
  # The contents. x and y are *centres* at 1x scale. The Finder
  # window is 540x380; we use a 1.5x-bigger background so the
  # icons and labels land inside the visible region.
  contents:
    - x: 188
      y: 230
      type: file
      name: Kingfisher.app
    - x: 460
      y: 230
      type: link
      # Symlink to the system Applications folder. Finder
      # presents it as the same icon a user would see in their
      # dock or sidebar, not as a link badge.
      path: /Applications
      name: Applications
  window:
    x: 100
    y: 120
    width: 540
    height: 380
  format: UDZO
  filesystem: HFS+

# Phase 36: when present, electron-builder reads these standard
# variables and signs + notarizes the produced artifacts. They are
# intentionally not committed; the release process documents where
# they come from (owner machine or a `release` GitHub environment).
#
#   CSC_LINK                 path or base64 of the .p12 containing
#                            the Developer ID Application
#                            certificate + private key.  Generated
#                            once from a Keychain export and
#                            imported back into the build
#                            keychain by electron-builder.
#   CSC_KEY_PASSWORD         password for that .p12.
#   CSC_IDENTITY_AUTO_DISCOVERY=false
#                            keeps electron-builder from
#                            accidentally falling back to an
#                            unrelated "Apple Development"
#                            identity when CSC_LINK is absent.
#   APPLE_API_KEY            path to the App Store Connect API
#                            key (.p8) for notarization.
#   APPLE_API_KEY_ID         key id from App Store Connect.
#   APPLE_API_ISSUER         issuer id of the App Store Connect
#                            team.  Together with the previous
#                            two this authenticates the
#                            submission without an iCloud
#                            password.
#
# When CSC_LINK is absent the build is unsigned, which is the
# expected behaviour for daily development builds. The
# `release:preflight:mac` gate refuses to run a *trusted* release
# build without the certificate present.
#
# publish is left null on purpose: we still want `latest-mac.yml`
# produced next to the ZIP, but we do not want electron-builder
# to talk to GitHub at build time. The release process uploads
# the artifacts with `gh release upload` after verification.
publish: null
