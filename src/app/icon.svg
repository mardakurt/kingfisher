<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    The Kingfisher mark: the bird on the Studio board. Four squares in the
    board's own near-white and periwinkle, filling the rounded tile to its
    edge, and the bird in the board frame's navy with the eye in the light
    square's colour. (Until Phase 85 a 5-unit navy frame ran round the squares,
    and every icon read as a board inset in a dark border.) Every value
    is in src/ui/palette.json (board.light, board.dark, board.frame);
    src/ui/brand-assets.test.ts fails when the two disagree.
  -->
  <defs><clipPath id="t"><rect width="64" height="64" rx="14"/></clipPath></defs>
  <g clip-path="url(#t)">
    <rect x="0" y="0" width="32" height="32" fill="#f1f3f9"/>
    <rect x="32" y="0" width="32" height="32" fill="#7f9bd3"/>
    <rect x="0" y="32" width="32" height="32" fill="#7f9bd3"/>
    <rect x="32" y="32" width="32" height="32" fill="#f1f3f9"/>
  </g>
  <g transform="translate(1.8 4.6) scale(0.94)">
    <path fill="#16224a" d="
      M58 30
      L34.2 25.6
      L31.4 19.2
      L26.4 16.4
      L22.2 10.8
      L19.6 16.2
      L14.8 19.4
      C11.4 24.8 10.8 29.8 12.6 34.4
      C14.9 40.1 20.0 43.2 25.9 42.8
      C29.6 42.5 32.0 39.6 33.2 34.4
      Z"/>
    <circle cx="26.2" cy="25.6" r="2.25" fill="#f1f3f9"/>
  </g>
</svg>
