<!doctype html>
<!--
  The historical backup entry for the Kingfisher landing page.

  The canonical landing now lives at the Vercel-hosted origin
  (`https://kingfisherchess.app/`) and is the single source of
  truth. This file exists only so the older GitHub Pages URL still
  reaches a meaningful page and existing external links to the
  mardakurt.github.io/kingfisher-data/ root do not 404.

  Do not add new content here. Edit the Vercel landing instead.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Kingfisher — moved</title>
    <meta http-equiv="refresh" content="0; url=https://kingfisherchess.app/" />
    <link rel="canonical" href="https://kingfisherchess.app/" />
  </head>
  <body>
    <p>
      Kingfisher has moved.
      <a href="https://kingfisherchess.app/">Continue to the canonical site.</a>
    </p>
    <script>
      // The meta refresh above is the primary redirect. A script
      // fallback covers browsers that have disabled meta refresh.
      window.location.replace('https://kingfisherchess.app/');
    </script>
  </body>
</html>
