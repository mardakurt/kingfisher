# Kingfisher's gates, run on the machine rather than on someone remembering.
#
# Independent jobs: `quality` and `build` answer cheap failures quickly, the
# visual gate protects the deliberate workstation compositions, and `e2e`
# exercises the full product with a real Stockfish download.
#
# Nothing here installs credentials. The authenticated Lichess checks are the
# opt-in `smoke:lichess` script and deliberately live outside CI; the explorer
# behaviour that CI does cover is contract-tested against a routed network.
#
# `e2e` runs at zero Playwright retries (see playwright.config.ts): a browser
# test green only on its second attempt is flaky, and flaky-but-green is not
# a passing release gate. e2e-diagnostic.yml is the separate, non-gating,
# manually-triggered workflow that runs the same suite with retries enabled,
# for telling "flaky" apart from "broken" without weakening this gate.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # For the visual-baselines job below, which is generated on demand.
  workflow_dispatch:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Playwright reads this to decide on retries and the HTML reporter.
  CI: 'true'

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # Caches the npm *download* cache only. Never node_modules, so a
          # broken lockfile cannot be masked by a warm install.
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Unit and integration tests
        run: npm test

      - name: Reject whitespace damage
        run: git diff --check HEAD

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

  # Baselines are per-platform because Chromium rasterises text differently on
  # macOS and Linux. This manual job is the reviewed update path; ordinary
  # pushes compare against the committed Linux set in the visual job below.
  visual-baselines:
    name: Visual baselines (Linux)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium chrome
      - name: Generate baselines
        run: npm run visual:baselines
      - uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-linux
          path: e2e/visual.spec.ts-snapshots/

  visual:
    name: Visual gate (Linux)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium chrome
      - name: Compare professional workstation compositions
        run: npx playwright test e2e/visual.spec.ts
      - name: Upload visual failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-failures
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Cached by the resolved Playwright version, so a dependency bump fetches
      # fresh browsers instead of running against stale ones.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium chrome

      # The cache restores the browsers but not the apt libraries they link
      # against, so the system dependencies are installed either way.
      - name: Install browser system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium chrome

      # Stockfish is GPL and ~15 MB, so it is fetched rather than committed.
      # Deliberately not cached: the E2E suite starts a real engine, and a
      # cached copy would let a broken installer pass unnoticed.
      - name: Install Stockfish
        run: npm run engine:install

      - name: Run Playwright
        run: npx playwright test

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          # Traces, screenshots and video for failed specs, plus the HTML
          # report. All generated from fixtures; no user data, no credentials.
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
