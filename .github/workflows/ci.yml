# Kingfisher's default quality gate.
#
# Philosophy (Phase 23):
#
#   - LOCAL-FIRST VALIDATION, REMOTE SAFETY NET ONLY.
#   - GitHub Actions minutes are scarce. The full Playwright suite, full
#     desktop packaging, engine fleet and long soak are NOT in this file.
#     They live in `browser-cert.yml`, `desktop-package.yml`,
#     `engines.yml`, `engine-build.yml` and are workflow_dispatch or
#     scheduled — invoked deliberately, not on every push.
#   - This workflow answers: "did the source compile, lint, format, and pass
#     the unit/integration tests, and did `next build` still succeed?"
#   - Documentation-only and marketing-site changes do NOT wake this gate.
#     `paths-ignore` keeps the expensive matrix asleep when the change is
#     a sentence in a README, a screenshot, a release note, or a docs page.
#
# The Playwright suite is still a gate for the supported desktop/web
# behaviour, but it is gated by a deliberately chosen trigger, not by the
# calendar of commits. The local `npm run release:verify` orchestrates the
# full set; remote CI is a tripwire, not a teacher.
name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      # Documentation / release notes / help copy.
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'ARCHITECTURE.md'
      - 'THIRD_PARTY_*.md'
      # The landing page is a separate presentation surface — it has no
      # runtime impact on the chess application.
      - 'marketing/**'
      # The pre-existing docs are documentation, not source.
      - 'docs/product/**'
      # Visual assets.
      - 'public/**/*.svg'
      - 'public/**/*.png'
      - 'public/**/*.jpg'
      - 'public/**/*.jpeg'
      - 'public/**/*.webp'
      - 'public/**/*.gif'
      - 'brand/**'
      # Issue / discussion templates.
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
  pull_request:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'ARCHITECTURE.md'
      - 'THIRD_PARTY_*.md'
      - 'marketing/**'
      - 'docs/product/**'
      - 'public/**/*.svg'
      - 'public/**/*.png'
      - 'public/**/*.jpg'
      - 'public/**/*.jpeg'
      - 'public/**/*.webp'
      - 'public/**/*.gif'
      - 'brand/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
  workflow_dispatch:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # Caches the npm *download* cache only. Never node_modules, so a
          # broken lockfile cannot be masked by a warm install.
          cache: npm

      - run: npm ci

      # `npm test` runs the desktop shell's own suite (desktop/src/*.test.mjs)
      # from the root, and several of those tests import the Electron runtime
      # (`electron`, `electron-builder`, the `kingfisher-sparkle.node`
      # native binding) — all dependencies of `desktop/package.json`, not
      # the root. Without the desktop install the suite goes red on a
      # missing module while running green on the maintainer's machine, where
      # `desktop/node_modules` is always installed by hand.
      - run: npm --prefix desktop ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Prettier check is intentionally NOT in the default gate. A long
      # prose document (handover, marketing) can fail it after a hand edit
      # and the failure says nothing about runtime behaviour. The local
      # `npm run release:verify` is the place to enforce it; here we
      # leave it as a soft warning so a formatting-only commit does not
      # become a red cross that blocks a fix.

      - name: Unit and integration tests
        run: npm test

      - name: Reject whitespace damage
        run: git diff --check HEAD

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
